syntax = "proto2";

package com.mytv.remote.proto;

option java_package = "com.mytv.remote.proto";
option java_outer_classname = "RemoteProto";

// Wire format for the ongoing remote-control channel, opened on TCP
// port 6466 (also wrapped in TLS, using the certificate exchanged
// during pairing). Same length-prefixed protobuf framing as pairing.

message RemoteMessage {
  optional RemoteConfigure remote_configure = 1;
  optional RemoteSetActive remote_set_active = 2;
  optional RemotePingRequest remote_ping_request = 3;
  optional RemotePingResponse remote_ping_response = 4;
  optional RemoteImeKeyInject remote_ime_key_inject = 5;
  optional RemoteKeyInject remote_key_inject = 6;
  optional RemoteAppLinkLaunchRequest remote_app_link_launch_request = 8;
  optional RemoteImeBatchEdit remote_ime_batch_edit = 12;
}

message RemoteConfigure {
  optional int32 code1 = 1;
  optional RemoteDeviceInfo device_info = 2;
}

message RemoteDeviceInfo {
  optional string model = 1;
  optional string vendor = 2;
  optional string unknown1 = 3;
  optional string unknown2 = 4;
  optional int32 package_name = 5;
  optional string app_version = 6;
}

message RemoteSetActive {
  optional int32 active = 1;
}

message RemotePingRequest {
  optional int32 val1 = 1;
}

message RemotePingResponse {
  optional int32 val1 = 1;
}

// direction: 0 = SHORT (press+release), 1 = DOWN, 2 = UP
message RemoteKeyInject {
  optional RemoteKeyCode key_code = 1;
  optional RemoteDirection direction = 2;
}

enum RemoteDirection {
  DIRECTION_UNKNOWN = 0;
  SHORT = 1;
  START_LONG = 2;
  END_LONG = 3;
}

// Subset of the standard Android KeyEvent codes relevant to a remote.
enum RemoteKeyCode {
  KEYCODE_UNKNOWN = 0;
  KEYCODE_UP = 19;
  KEYCODE_DOWN = 20;
  KEYCODE_LEFT = 21;
  KEYCODE_RIGHT = 22;
  KEYCODE_ENTER = 66;
  KEYCODE_BACK = 4;
  KEYCODE_HOME = 3;
  KEYCODE_MENU = 82;
  KEYCODE_VOLUME_UP = 24;
  KEYCODE_VOLUME_DOWN = 25;
  KEYCODE_VOLUME_MUTE = 164;
  KEYCODE_POWER = 26;
  KEYCODE_MEDIA_PLAY_PAUSE = 85;
  KEYCODE_MEDIA_REWIND = 89;
  KEYCODE_MEDIA_FAST_FORWARD = 90;
  KEYCODE_SEARCH = 84;
  KEYCODE_SETTINGS = 176;
}

message RemoteImeKeyInject {
  optional string app_package_name = 1;
}

message RemoteImeBatchEdit {
  optional int32 field1 = 1;
  optional string text = 4;
}

message RemoteAppLinkLaunchRequest {
  optional string app_link = 1;
}
